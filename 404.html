<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Music - Redirecting...</title>
  <script>
    // Automatic recovery from 404 / lowercase / subpath URLs
    const repoBase = '/Pulse/';
    const currentPath = window.location.pathname;
    
    // If user opened /pulse (lowercase) or / or sub-route, redirect to /Pulse/
    if (!currentPath.startsWith(repoBase)) {
      window.location.replace(window.location.origin + repoBase);
    } else {
      window.location.replace(window.location.origin + repoBase + 'index.html');
    }
  </script>
</head>
<body style="background: #0b0d14; color: #fff; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center;">
  <div>
    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Redirecting to Pulse Music...</h2>
    <p style="color: #94a3b8; font-size: 0.9rem;">Taking you to the official Pulse experience...</p>
    <a href="https://pushkarhiremath68-cyber.github.io/Pulse/" style="display: inline-block; margin-top: 1rem; padding: 0.75rem 1.5rem; background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%); color: #fff; text-decoration: none; border-radius: 999px; font-weight: 700;">Open Pulse Music</a>
  </div>
</body>
</html>
