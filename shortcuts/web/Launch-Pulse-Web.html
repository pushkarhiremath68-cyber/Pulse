<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Music - Launch</title>
  <meta name="description" content="High-Fidelity Cross-Platform Music Streaming by Pushkar Hiremath">
  <meta name="theme-color" content="#8b5cf6">
  <link rel="icon" type="image/png" sizes="192x192" href="../../public/icons/icon-192.png">
  <meta http-equiv="refresh" content="2; url=https://pushkarhiremath68-cyber.github.io/Pulse/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #050508 0%, #0b0d14 40%, #1a0d2e 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; overflow: hidden;
    }
    .logo {
      width: 120px; height: 120px; margin-bottom: 28px; border-radius: 24px;
      animation: pulse 2s infinite ease-in-out;
      filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.5));
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.4)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 40px rgba(139, 92, 246, 0.8)); }
    }
    h1 {
      font-size: 28px; font-weight: 700; margin: 0 0 8px;
      background: linear-gradient(135deg, #fff, #c4b5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(139, 92, 246, 0.2); border-top-color: #8b5cf6;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { color: #64748b; font-size: 13px; }
    .link { margin-top: 24px; color: #8b5cf6; text-decoration: none; font-size: 13px; opacity: 0.7; }
    .link:hover { opacity: 1; }
  </style>
</head>
<body>
  <img class="logo" src="../../public/icons/icon-512.png" alt="Pulse Music"
       onerror="this.src='../../pulse-logo.png'">
  <h1>Pulse Music</h1>
  <p class="subtitle">High-Fidelity Cross-Platform Music Streaming</p>
  <div class="spinner"></div>
  <p class="status">Redirecting to your music experience...</p>
  <a class="link" href="https://pushkarhiremath68-cyber.github.io/Pulse/">Click here if not redirected</a>
  <script>setTimeout(function(){ window.location.href = "https://pushkarhiremath68-cyber.github.io/Pulse/"; }, 1500);</script>
</body>
</html>
