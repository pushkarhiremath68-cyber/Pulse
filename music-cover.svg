<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="40%" stop-color="#181a2e"/>
      <stop offset="80%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <radialGradient id="meshGlow1" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.45)"/>
      <stop offset="60%" stop-color="rgba(99, 102, 241, 0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <radialGradient id="meshGlow2" cx="75%" cy="80%" r="55%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.35)"/>
      <stop offset="70%" stop-color="rgba(16, 185, 129, 0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Background Canvas -->
  <rect width="600" height="600" rx="36" fill="url(#bgGrad)"/>
  <rect width="600" height="600" rx="36" fill="url(#meshGlow1)"/>
  <rect width="600" height="600" rx="36" fill="url(#meshGlow2)"/>
  <rect width="598" height="598" x="1" y="1" rx="35" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Frosted Glass Center Card -->
  <g filter="url(#glassShadow)">
    <rect x="90" y="90" width="420" height="420" rx="28" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
  </g>

  <!-- Modern Dynamic Waveform Bars -->
  <g transform="translate(160, 220)">
    <rect x="0" y="40" width="16" height="80" rx="8" fill="url(#accentGrad)" opacity="0.7"/>
    <rect x="28" y="20" width="16" height="120" rx="8" fill="url(#accentGrad)" opacity="0.85"/>
    <rect x="56" y="55" width="16" height="50" rx="8" fill="url(#accentGrad)" opacity="0.75"/>
    <rect x="84" y="0" width="16" height="160" rx="8" fill="url(#accentGrad)" opacity="0.95"/>
    <rect x="112" y="30" width="16" height="100" rx="8" fill="url(#accentGrad)" opacity="0.9"/>
    <rect x="140" y="10" width="16" height="140" rx="8" fill="url(#accentGrad)" opacity="1"/>
    <rect x="168" y="45" width="16" height="70" rx="8" fill="url(#accentGrad)" opacity="0.8"/>
    <rect x="196" y="15" width="16" height="130" rx="8" fill="url(#accentGrad)" opacity="0.95"/>
    <rect x="224" y="35" width="16" height="90" rx="8" fill="url(#accentGrad)" opacity="0.85"/>
    <rect x="252" y="60" width="16" height="40" rx="8" fill="url(#accentGrad)" opacity="0.7"/>
  </g>

  <!-- Studio Audio Master Branding -->
  <text x="300" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">PULSE MASTER</text>
  <text x="300" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#a855f7" text-anchor="middle" letter-spacing="4">LOSSLESS HI-FI AUDIO</text>
</svg>
