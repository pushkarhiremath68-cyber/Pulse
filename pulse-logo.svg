<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Ultra HD Purple Radial Glow Background -->
    <radialGradient id="bg-purple-hd" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>

    <!-- Crisp Soft Ambient Drop Shadow -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feOffset dx="0" dy="8" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- High-Res Vibrant Purple Background Container with Smooth Rounded Corners -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg-purple-hd)"/>

  <!-- Iconic Centered High-Definition Black Audio Waveform Pulse -->
  <g filter="url(#soft-shadow)">
    <path d="M 160 512 L 280 512 L 340 400 L 405 630 L 470 230 L 540 790 L 605 320 L 670 610 L 730 400 L 790 512 L 864 512" 
          fill="none" 
          stroke="#09090b" 
          stroke-width="54" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
